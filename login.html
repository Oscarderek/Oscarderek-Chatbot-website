<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ChatDek</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #001f3f, #007bff);
            color: white;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 350px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-weight: 600;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 400;
            text-align: left;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus {
            border-color: #ff416c;
            box-shadow: 0 0 8px rgba(255, 65, 108, 0.8);
            background: rgba(255, 255, 255, 0.3);
        }

        .show-password {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .password-container {
            position: relative;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 20px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0px 8px 20px rgba(255, 75, 43, 0.5);
        }

        .signup-link {
            display: inline-block;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.3s, color 0.3s;
        }

        .signup-link:hover {
            background: rgba(255, 255, 255, 0.5);
            color: #ff416c;
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <h2>Login</h2>

        <form method="POST">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required placeholder="Enter your email">
            
            <label for="password">Password:</label>
            <div class="password-container">
                <input type="password" name="password" id="password" required placeholder="Enter your password">
                <i class="fas fa-eye show-password" id="togglePassword" onclick="togglePassword()"></i>
            </div>
            
            <button type="submit">Login</button>
        </form>
        <a href="{{ url_for('signup') }}" class="signup-link">Create an account</a>
    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const icon = document.getElementById('togglePassword');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
